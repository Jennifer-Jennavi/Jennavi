<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jennavi Lead Test</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
width:380px;
}

input,
textarea,
button{
width:100%;
padding:12px;
margin-top:12px;
box-sizing:border-box;
font-size:16px;
}

textarea{
height:120px;
resize:vertical;
}

button{
background:#111;
color:#fff;
border:none;
cursor:pointer;
}

#status{
margin-top:20px;
font-weight:bold;
text-align:center;
}
</style>

</head>

<body>

<div class="card">

<h2>Jennavi Lead Test</h2>

<input id="name" placeholder="Name">

<input id="email" type="email" placeholder="Email">

<textarea id="message" placeholder="Message"></textarea>

<button id="submitBtn">
Submit
</button>

<div id="status"></div>

</div>

<script>

const WEB_APP_URL="https://script.google.com/macros/s/AKfycbyGcEpF8YXAT27WCk3AG48k3JGXjq5FpLpbmu1y4qRdkEUUA1DiRuGQ1ZeBCug7Pn9imw/exec";

document.getElementById("submitBtn").onclick=async()=>{

const status=document.getElementById("status");

status.innerHTML="Sending...";

try{

const res=await fetch(WEB_APP_URL,{
method:"POST",
redirect:"follow",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:document.getElementById("name").value,
email:document.getElementById("email").value,
message:document.getElementById("message").value
})
});

const json=await res.json();

status.innerHTML="✅ "+json.status;

}catch(e){

status.innerHTML="❌ "+e.message;
console.error(e);

}

};

</script>

</body>
</html>
