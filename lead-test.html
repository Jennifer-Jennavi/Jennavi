<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jennavi Apps Script Test</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h2{
    margin:0 0 20px;
    text-align:center;
}

input,
textarea,
button{
    width:100%;
    padding:14px;
    margin-top:14px;
    font-size:16px;
    border-radius:8px;
    border:1px solid #ccc;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    background:#111;
    color:#fff;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#333;
}

#status{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>Jennavi Lead Capture Test</h2>

<form id="leadForm">

<input
type="text"
id="name"
placeholder="Your Name"
required>

<input
type="email"
id="email"
placeholder="Your Email"
required>

<textarea
id="message"
placeholder="Your Message"
required></textarea>

<button type="submit">
Submit Test
</button>

</form>

<div id="status"></div>

</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwJ3c4A4xkLTqyZVuijcgNmYALamySS7bu2xsvrN3jO6MIaZEg8oKH5alYduG_WR8z33Q/exec";

const form = document.getElementById("leadForm");
const status = document.getElementById("status");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    status.textContent = "Sending...";

    const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
    };

    try {

        const response = await fetch(WEB_APP_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        console.log(result);

        status.textContent = "✅ Success!";

        form.reset();

    } catch (error) {

        console.error(error);

        status.textContent = "❌ " + error.message;

    }

});
</script>

</body>
</html>
